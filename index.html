<style>
/* Layout: one-column phone tool; sticky header, content cards by role, fixed bottom tab bar. Copper accent = copper pipe, slate = service truck. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e8edf1; --fg:#17222c; --muted:#5b6b78; --line:#d3dbe2;
  --accent:#a8571f; --accent-fg:#ffffff; --brand:#1d3347; --brand-fg:#f3f6f8;
  --ok:#1f7a4a; --ok-bg:#e1f2e8; --warn:#8a5a00; --warn-bg:#fdf0d2; --bad:#b3261e; --bad-bg:#fbe3e1; --info-bg:#e3edf6;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --paper:#ffffff; /* signature pad stays white paper with dark ink in both themes */
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#18222b; --sunk:#202c36; --fg:#e7edf1; --muted:#9aabb8; --line:#2e3c48;
  --accent:#e08a4c; --accent-fg:#1a0e05; --brand:#0b1218; --brand-fg:#e7edf1;
  --ok:#6fd39c; --ok-bg:#163526; --warn:#f2c46b; --warn-bg:#3a2d10; --bad:#ff8f86; --bad-bg:#3d1a18; --info-bg:#1b2c3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#18222b; --sunk:#202c36; --fg:#e7edf1; --muted:#9aabb8; --line:#2e3c48;
  --accent:#e08a4c; --accent-fg:#1a0e05; --brand:#0b1218; --brand-fg:#e7edf1;
  --ok:#6fd39c; --ok-bg:#163526; --warn:#f2c46b; --warn-bg:#3a2d10; --bad:#ff8f86; --bad-bg:#3d1a18; --info-bg:#1b2c3b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;margin:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.35rem} h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-fg);padding:10px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-size:1.25rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crew{font-size:.8rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--brand-fg);border-radius:8px;padding:6px 10px;font-size:.85rem}
main{padding:12px 16px 110px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:10px 2px 12px;font-family:var(--f-display);font-weight:600;font-size:.95rem;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.dark{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:34px;padding:6px 10px;font-size:.9rem}
.btn:disabled{opacity:.45}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.p-open{background:var(--warn-bg);color:var(--warn)} .p-complete{background:var(--info-bg);color:var(--fg)}
.p-sent{background:var(--ok-bg);color:var(--ok)} .p-invoiced{background:var(--sunk);color:var(--muted)}
.p-day{background:var(--sunk);color:var(--fg)} .p-prem{background:var(--warn-bg);color:var(--warn)} .p-hol{background:var(--bad-bg);color:var(--bad)}
.note{border-radius:8px;padding:10px 12px;font-size:.92rem}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--bad-bg);color:var(--bad)} .note.ok{background:var(--ok-bg);color:var(--ok)} .note.info{background:var(--info-bg)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .s{font-size:.85rem;color:var(--muted)}
.item .price{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;white-space:nowrap;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg)}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:1.2rem;font-weight:700}
.stepper input{width:64px;text-align:center;padding:8px 4px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.total{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.sig{border:1px dashed var(--muted);border-radius:8px;background:var(--paper);touch-action:none;width:100%;height:140px;display:block}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos figure{margin:0;position:relative}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photos button{position:absolute;top:-6px;right:-6px;border-radius:999px;border:0;background:var(--bad);color:#fff;width:24px;height:24px;font-size:.8rem}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.98rem}
.check input{width:22px;height:22px;flex:none;margin-top:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--brand);color:var(--brand-fg);padding:10px 16px;border-radius:999px;z-index:9;font-weight:600;max-width:90vw}
.pickbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:4;background:var(--accent);color:var(--accent-fg);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px}
.pickbar .btn{background:var(--accent-fg);color:var(--accent);border:0;min-height:36px}
pre.out{white-space:pre-wrap;word-break:break-word;background:var(--sunk);border-radius:8px;padding:10px;font-size:.8rem;max-height:220px;overflow:auto;margin:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.demo{background:var(--info-bg);border-radius:8px;padding:8px 12px;font-size:.88rem}
details>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.05rem}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>

/* photos in IndexedDB */
let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("saucierPhotos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null)}catch(e){res(null)}})}
function pPut(id,data){return new Promise(res=>{if(!idb)return res(false);try{const t=idb.transaction("p","readwrite");t.objectStore("p").put(data,id);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
function pGet(id){return new Promise(res=>{if(!idb)return res(null);try{const r=idb.transaction("p").objectStore("p").get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})}
function pDel(id){try{idb&&idb.transaction("p","readwrite").objectStore("p").delete(id)}catch(e){}}

/* ---------- price book ---------- */
let ITEMS=[], BYSKU={};
function qboName(sku,name){return (sku+" "+String(name).trim()).replace(/:/g,"-").replace(/'/g,"").slice(0,100)}
function setPrices(items){
  ITEMS=items.filter(i=>i.sku!=="FEE-005");
  BYSKU={};ITEMS.forEach(i=>{i.qbo=i.qbo||qboName(i.sku,i.name);BYSKU[i.sku]=i});
}
function priceFor(it,dt){return dt==="Holiday"?it.hol:(dt==="Weekend"||dt==="Emergency")?it.ah:it.list}
const FEE = n => DATA.fees[n][0];

/* ---------- dates & day type ---------- */
const pad=n=>String(n).padStart(2,"0");
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function today(){return iso(new Date())}
function mondayOf(s){const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function dayName(s){return DAYS[(parse(s).getDay()+6)%7]}
function holidayName(s){const h=holidays().find(h=>h[0]===s);return h?h[1]:""}
function holidays(){return (S&&S.holidays)||DATA.hol}
function dayType(s,emerg){if(holidayName(s))return "Holiday";const k=(parse(s).getDay()+6)%7;if(k>=5)return "Weekend";if(k===4)return "Friday";return emerg?"Emergency":"Mon-Thu"}
function usd(n){return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function hrs(n){return (Math.round(n*100)/100).toString()}
function fmtDate(s){const d=parse(s);return DAYS[(d.getDay()+6)%7].slice(0,3)+" "+(d.getMonth()+1)+"/"+d.getDate()}
function mdy(s){const d=parse(s);return pad(d.getMonth()+1)+"/"+pad(d.getDate())+"/"+d.getFullYear()}
const r2=n=>Math.round(n*100)/100;
const q4=n=>Math.round(Number(n||0)*4)/4;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- ticket math ---------- */
function custLabel(t){const c=t.customer||{};return [c.name,[c.street,c.city].filter(Boolean).join(", ")].filter(Boolean).join(" - ")}
function isStandAlone(t){
  if(t.standAlone==="yes")return true; if(t.standAlone==="no")return false;
  const sk=t.lines.filter(l=>BYSKU[l.sku]);
  return sk.length===1&&Number(sk[0].qty)===1&&!(Number(t.tm.lead)>0||Number(t.tm.helper)>0)&&BYSKU[sk[0].sku].sa>BYSKU[sk[0].sku].list;
}
function calc(t){
  const dt=dayType(t.date,t.emergency), m=RULES.mult[dt];
  const inv=[], hasHelper=!!(t.helper||"").trim();
  let leadPay=0, helperPay=0, leadHrs=0, helperHrs=0, book=0;
  const premCode = dt==="Holiday"?"FEE-003":(m>1?"FEE-002":null);
  const premLabel = dt==="Holiday"?"Holiday premium":"After-hours premium";
  t.lines.forEach(l=>{
    const it=BYSKU[l.sku]; if(!it)return; const q=Number(l.qty)||0; if(q<=0)return;
    inv.push({item:it.qbo,code:it.sku,desc:it.name,qty:q,rate:it.list,amt:r2(q*it.list)});
    if(premCode){const p=priceFor(it,dt)-it.list;if(p>0)inv.push({item:FEE(premCode),code:premCode,desc:premLabel+" - "+it.name,qty:q,rate:p,amt:r2(q*p)})}
    const ph=it.hrs*q; book+=ph; const crew=hasHelper?(l.crew||"Both"):"Lead";
    if(crew!=="Helper"){leadPay+=ph*m*RULES.leadRate;leadHrs+=ph}
    if(crew!=="Lead"&&hasHelper){helperPay+=ph*m*RULES.helperRate;helperHrs+=ph}
  });
  if(isStandAlone(t)){const l=t.lines.find(l=>BYSKU[l.sku]);if(l){const it=BYSKU[l.sku];const d=it.sa-it.list;if(d>0)inv.push({item:FEE("FEE-004"),code:"FEE-004",desc:"Stand-alone minimum - "+it.name,qty:1,rate:d,amt:d})}}
  const tl=q4(t.tm.lead), th=hasHelper?q4(t.tm.helper):0, tmh=tl+th;
  if(tmh>0){
    inv.push({item:FEE("FEE-005"),code:"FEE-005",desc:"Time and material labor ("+[tl?"Lead "+hrs(tl)+" hr":"",th?"Helper "+hrs(th)+" hr":""].filter(Boolean).join(", ")+")",qty:tmh,rate:RULES.laborRate,amt:r2(tmh*RULES.laborRate)});
    if(premCode)inv.push({item:FEE(premCode),code:premCode,desc:premLabel+" - T&M labor",qty:tmh,rate:r2(RULES.laborRate*(m-1)),amt:r2(tmh*RULES.laborRate*(m-1))});
    leadPay+=tl*m*RULES.leadRate; helperPay+=th*m*RULES.helperRate; leadHrs+=tl; helperHrs+=th;
  }
  const mc=Number(t.tm.mtl)||0; if(mc>0){const p=r2(mc*(1+RULES.mtlMarkup));inv.push({item:FEE("FEE-006"),code:"FEE-006",desc:"Materials"+(t.tm.mtlDesc?": "+t.tm.mtlDesc:""),qty:1,rate:p,amt:p})}
  const base=r2(inv.reduce((a,x)=>a+((BYSKU[x.code]||["FEE-004","FEE-005","FEE-006"].includes(x.code))?x.amt:0),0));
  if(base>0&&base<RULES.minTicket){const d=r2(RULES.minTicket-base);inv.push({item:FEE("FEE-004"),code:"FEE-004",desc:"Minimum charge adjustment ("+usd(RULES.minTicket)+" job minimum)",qty:1,rate:d,amt:d})}
  const pm=Number(t.tm.permit)||0; if(pm>0)inv.push({item:FEE("FEE-007"),code:"FEE-007",desc:"Permit fee (at cost)",qty:1,rate:pm,amt:pm});
  if(t.dispatch)inv.push({item:FEE("FEE-001"),code:"FEE-001",desc:"Dispatch / service call fee",qty:1,rate:RULES.dispatch,amt:RULES.dispatch});
  const total=r2(inv.reduce((a,b)=>a+b.amt,0));
  return {dt,m,inv,total,book,tmh,leadPay:r2(leadPay),helperPay:r2(helperPay),leadHrs,helperHrs,hasHelper};
}
function ticketIssues(t){
  const out=[], c=calc(t);
  if(!(t.customer.name||"").trim())out.push("Customer name is missing");
  if(!(t.customer.street||"").trim())out.push("Job address is missing");
  if(!c.inv.some(x=>x.code!=="FEE-001"&&x.code!=="FEE-007"))out.push("No work on the ticket (add a price-book task or T&M hours)");
  t.lines.forEach(l=>{if(!BYSKU[l.sku])out.push("Unknown SKU "+l.sku);if(Math.abs(q4(l.qty)-Number(l.qty))>1e-9)out.push(l.sku+": quantity must be in 0.25 steps")});
  if(t.lines.some(l=>BYSKU[l.sku])&&(Number(t.tm.lead)>0||Number(t.tm.helper)>0))out.push("Has both price-book tasks and T&M hours: make sure the T&M part was approved");
  if(!t.sig)out.push("No customer signature");
  if(!t.check.done)out.push("Completion checklist not ticked");
  return out;
}
function nextNo(date,crew){const base=date.slice(2).replace(/-/g,"")+"-"+crew+"-";let n=1;while(S.tickets.some(t=>t.no===base+pad(n)))n++;return base+pad(n)}
function newTicket(){
  const st=S.settings, d=today();
  const t={id:uid(),no:nextNo(d,st.crew),crew:Number(st.crew)||1,lead:st.lead,helper:st.helper,date:d,emergency:false,
    customer:{name:"",street:"",city:"",zip:"",phone:"",email:""},lines:[],tm:{lead:0,helper:0,mtl:0,mtlDesc:"",permit:0},
    dispatch:false,standAlone:"auto",arrive:"",depart:"",notes:"",check:{done:false,clean:false,photos:false,explained:false},sig:"",photos:[],
    status:"open",createdAt:Date.now(),updatedAt:Date.now()};
  S.tickets.push(t);save();return t;
}
const T = id => S.tickets.find(t=>t.id===id);

/* ---------- week pay (same math as the Weekly Piece Pay Record) ---------- */
function weekKey(mon,crew){return mon+"|"+crew}
function weekRec(mon,crew){const k=weekKey(mon,crew);if(!S.weeks[k]){const days={};DAYS.forEach((d,i)=>{const ds=addDays(mon,i);const hol=holidayName(ds)?RULES.holHrs:0;days[d]={lh:0,hh:0,lhol:hol,hhol:hol,lvac:0}});S.weeks[k]={mon,crew:Number(crew),lead:"",helper:"",days,updatedAt:0}}return S.weeks[k]}
function weekTickets(mon,crew){return S.tickets.filter(t=>mondayOf(t.date)===mon&&(crew==null||Number(t.crew)===Number(crew))).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.no<b.no?-1:1))}
function weekPay(mon,crew){
  const w=weekRec(mon,crew), ts=weekTickets(mon,crew).filter(t=>t.status!=="open");
  const o={lead:{piece:0,paid:0},helper:{piece:0,paid:0},customer:0};
  ts.forEach(t=>{const c=calc(t);o.lead.piece+=c.leadPay;o.helper.piece+=c.helperPay;o.lead.paid+=c.leadHrs;o.helper.paid+=c.helperHrs;o.customer+=c.total});
  const sum=f=>DAYS.reduce((a,d)=>a+(Number(w.days[d][f])||0),0);
  const fin=(p,hw,holH,vacH,pto)=>{p.hw=hw;p.floor=RULES.minWage*hw;p.makeup=Math.max(0,p.floor-p.piece);p.rr=hw?(p.piece+p.makeup)/hw:0;p.ot=Math.max(0,hw-RULES.otAfter);p.otp=RULES.otFactor*p.rr*p.ot;p.holH=holH;p.holPay=holH*pto;p.vacH=vacH;p.vacPay=vacH*pto;p.gross=p.piece+p.makeup+p.otp+p.holPay+p.vacPay;return p};
  fin(o.lead,sum("lh"),sum("lhol"),sum("lvac"),Number(S.settings.ptoLead)||RULES.ptoLead);
  fin(o.helper,sum("hh"),sum("hhol"),0,Number(S.settings.ptoHelper)||RULES.ptoHelper);
  o.tickets=ts.length;o.open=weekTickets(mon,crew).filter(t=>t.status==="open").length;
  return o;
}

/* ---------- exports ---------- */
function csvCell(v){v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return rows.map(r=>r.map(csvCell).join(",")).join("\r\n")+"\r\n"}
function toTSV(rows){return rows.map(r=>r.map(v=>String(v==null?"":v).replace(/[\t\r\n]+/g," ")).join("\t")).join("\n")}
function payrollRows(mon){
  const rows=[["Week start","Crew sheet","Record","Day","Day type","Customer name / address","SKU #","Crew","Qty","Lead hrs worked","Helper hrs worked","Lead holiday hrs","Helper holiday hrs","Lead vacation hrs","Ticket # / note","Lead name","Helper name"]];
  const crews=[...new Set([...weekTickets(mon,null).filter(t=>t.status!=="open").map(t=>Number(t.crew)),...Object.values(S.weeks).filter(w=>w.mon===mon&&w.updatedAt).map(w=>Number(w.crew))])].sort();
  crews.forEach(c=>{
    const ts=weekTickets(mon,c).filter(t=>t.status!=="open"), w=weekRec(mon,c);
    const lead=w.lead||(ts[0]&&ts[0].lead)||"", helper=w.helper||(ts.find(t=>t.helper)||{}).helper||"";
    rows.push([mon,c,"NAMES","","","","","","","","","","","","",lead,helper]);
    ts.forEach(t=>{
      const dt=dayType(t.date,t.emergency), cust=custLabel(t), hh=!!(t.helper||"").trim();
      t.lines.forEach(l=>{if(BYSKU[l.sku]&&Number(l.qty)>0)rows.push([mon,c,"TICKET LINE",dayName(t.date),dt,cust,l.sku,hh?(l.crew||"Both"):"Lead",Number(l.qty),"","","","","",t.no,"",""])});
      if(q4(t.tm.lead)>0)rows.push([mon,c,"TICKET LINE",dayName(t.date),dt,cust,"FEE-005","Lead",q4(t.tm.lead),"","","","","",t.no+" T&M","",""]);
      if(hh&&q4(t.tm.helper)>0)rows.push([mon,c,"TICKET LINE",dayName(t.date),dt,cust,"FEE-005","Helper",q4(t.tm.helper),"","","","","",t.no+" T&M","",""]);
    });

async function importBundle(obj){

  (obj.tickets||[]).forEach(t=>{const cur=S.tickets.find(x=>x.id===t.id);if(!cur){S.tickets.push(Object.assign({},t,{status:t.status==="open"?"open":"sent"}));added++}else if((t.updatedAt||0)>(cur.updatedAt||0)){Object.assign(cur,t,{status:cur.status==="invoiced"?"invoiced":(t.status==="open"?"open":"sent")});updated++}else skipped++});
  Object.values(obj.weeks||{}).forEach(w=>{const k=weekKey(w.mon,w.crew);const cur=S.weeks[k];if(!cur||(w.updatedAt||0)>=(cur.updatedAt||0))S.weeks[k]=w});
  for(const [k,v] of Object.entries(obj.photos||{}))await pPut(k,v);
  save();return {added,updated,skipped};
}

let sigCtx=null,sigDirty=false;

function sigData(cv){const o=document.createElement("canvas");o.width=360;o.height=120;const x=o.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,360,120);x.drawImage(cv,0,0,360,120);return o.toDataURL("image/png")}
function shrink(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1100/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.6))};img.onerror=()=>res(null);img.src=fr.result};fr.readAsDataURL(file)})}

  else if(["tm_lead","tm_helper","tm_mtl","tm_permit"].includes(el.id)){t.tm[el.id.slice(3)]=Number(el.value)||0}
  else if(["t_lead","t_helper","t_notes","t_arrive","t_depart"].includes(el.id)){t[el.id.slice(2)]=el.value}
  else if(/^q_\d+$/.test(el.id)){t.lines[Number(el.id.slice(2))].qty=Number(el.value)||0}
  else return;
  t.updatedAt=Date.now();save();const tt=document.getElementById("totals");if(tt)tt.innerHTML=totalsHTML(t);
});
document.addEventListener("change",async e=>{
  const el=e.target, t=V.ticket&&T(V.ticket);
  if(el.id==="o_files"){let a=0,u=0,bad=0;for(const f of el.files){try{const r=await importBundle(JSON.parse(await f.text()));a+=r.added;u+=r.updated}catch(_){bad++}}toast(`Imported ${a} new, ${u} updated${bad?`, ${bad} file(s) not readable`:""}`);render();return}
  if(el.dataset.wk){el.value=q4(el.value)||"";const ws=document.getElementById("wkSum");if(ws)ws.innerHTML=weekSumHTML(V.week,S.settings.crew);const w=weekRec(V.week,S.settings.crew);["lh","hh","lhol","hhol","lvac"].forEach(f=>{const c=document.getElementById("ws_"+f);if(c)c.textContent=hrs(DAYS.reduce((a,d)=>a+(Number(w.days[d][f])||0),0))});return}
  if(!t)return;
  if(el.id==="c_name"&&t.status==="open"){const c=S.customers[el.value.trim()];if(c&&!t.customer.street){Object.assign(t.customer,c);t.updatedAt=Date.now();save();render()}return}
  if(el.id==="t_photo"){for(const f of el.files){const d=await shrink(f);if(!d)continue;const id="ph_"+uid();if(await pPut(id,d)){t.photos.push(id)}else toast("Photos cannot be saved in this browser")}t.updatedAt=Date.now();save();render();return}
  if(t.status!=="open")return;
  if(el.id==="t_date"&&el.value){t.date=el.value;if(dayType(t.date,false)!=="Mon-Thu")t.emergency=false;t.no=t.no.startsWith(t.date.slice(2).replace(/-/g,""))?t.no:nextNo(t.date,t.crew)}
  else if(el.id==="t_emerg")t.emergency=el.checked;
  else if(el.id==="t_disp")t.dispatch=el.checked;
  else if(el.id==="t_sa")t.standAlone=el.value;
  else if(el.dataset.chk)t.check[el.dataset.chk]=el.checked;
  else if(["tm_lead","tm_helper"].includes(el.id)){t.tm[el.id.slice(3)]=q4(el.value);el.value=t.tm[el.id.slice(3)]||"";return softUpdate(t)}
  else if(/^q_\d+$/.test(el.id)){const i=Number(el.id.slice(2)),l=t.lines[i];l.qty=Math.max(.25,q4(el.value));el.value=hrs(l.qty);const la=document.getElementById("la_"+i);if(la)la.textContent=usd(priceFor(BYSKU[l.sku],dayType(t.date,t.emergency))*l.qty);return softUpdate(t)}
  else return;
  t.updatedAt=Date.now();save();render();
});

function softUpdate(t){t.updatedAt=Date.now();save();const tt=document.getElementById("totals");if(tt)tt.innerHTML=totalsHTML(t)}

(async function start(){
  S=load()||blank();
  setPrices(S.prices?S.prices.items:DATA.items);
  if(DEMO&&!S.tickets.length&&!S.demoSeen){seedDemo();S.demoSeen=true;save()}
  await openDB();
  render();
  try{const r=await fetch("prices.json",{cache:"no-store"});if(r.ok){const p=await r.json();if(p&&p.items&&p.items.length>10&&(!S.prices||p.updated>S.prices.updated)){S.prices={updated:p.updated,items:p.items};setPrices(p.items);save();render();toast("Price book updated "+p.updated)}}}catch(e){}
  if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
})();
